<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rosetta - IDML Translator</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 60px auto; color: #1a1a1a; }
    h1 { font-size: 22px; }
    .subtitle { color: #666; margin-bottom: 32px; }
    form { border: 1px solid #ddd; border-radius: 8px; padding: 24px; }
    label.field { display: block; margin-bottom: 20px; font-weight: 600; }
    input[type=file] { display: block; margin-top: 8px; font-weight: normal; }
    .langs { display: flex; gap: 20px; margin-top: 8px; font-weight: normal; }
    .langs label { display: flex; align-items: center; gap: 6px; font-weight: normal; }
    button { background: #1a1a1a; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #333; }
    .error { background: #fee; border: 1px solid #f99; color: #900; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; }
    .hint { color: #888; font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Rosetta - IDML Translator</h1>
  <p class="subtitle">Upload a .zip with one .idml file and a Links folder. Runs locally only.</p>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form action="/upload" method="post" enctype="multipart/form-data">
    <label class="field">
      Upload zip
      <input type="file" name="idml_zip" accept=".zip" required>
      <div class="hint">Must contain exactly one .idml file and a Links folder.</div>
    </label>

    <label class="field">
      Target language(s)
      <div class="langs">
        {% for code, name in languages.items() %}
          <label><input type="checkbox" name="langs" value="{{ code }}"> {{ name }}</label>
        {% endfor %}
      </div>
    </label>

    <button type="submit">Translate</button>
  </form>
</body>
</html>
